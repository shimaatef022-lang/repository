<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Cairo Bites</title>

    <link rel="icon"
        href="photo/Brown and Black Circle Illustrated Burger Pizza Logo.jpg">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">

        <img
            src="photo/Brown and Black Circle Illustrated Burger Pizza Logo.jpg"
            alt="Cairo Bites Logo">

    </div>

    <h2>Checkout</h2>

</header>



<!-- ================= CHECKOUT ================= -->

<section class="checkout">

    <div class="checkout-box">

        <h1>
            Complete Your Order
        </h1>

        <p>
            Please enter your information to complete your order.
        </p>


        <!-- CUSTOMER INFORMATION -->

        <form id="checkout-form">


            <!-- NAME -->

            <label for="customer-name">
                Customer Name
            </label>

            <input
                type="text"
                id="customer-name"
                placeholder="Enter your name"
                required>



            <!-- PHONE -->

            <label for="phone">
                Mobile Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your mobile number"
                required>



            <!-- LOCATION -->

            <label for="location">
                Location / Address
            </label>

            <textarea
                id="location"
                placeholder="Enter your address or location"
                required></textarea>



            <!-- ORDER -->

            <h2>
                Your Order
            </h2>

            <div id="checkout-items">

                <!-- Products will appear here -->

            </div>



            <!-- TOTAL -->

            <h3 class="checkout-total">

                Total:

                <span id="checkout-total">
                    0
                </span>

                EGP

            </h3>



            <!-- CONFIRM -->

            <button
                type="submit"
                class="order-btn">

                Confirm Order

            </button>


        </form>

    </div>

</section>



<!-- ================= JAVASCRIPT ================= -->

<script src="script.js"></script>


</body>

</html>
