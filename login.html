<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Cairo Bites</title>

    <!-- Favicon -->
    <link rel="icon"
        href="photo/Brown and Black Circle Illustrated Burger Pizza Logo.jpg">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">

            <img
                src="photo/Brown and Black Circle Illustrated Burger Pizza Logo.jpg"
                alt="Cairo Bites Logo">

        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#menu">
                Menu
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </nav>

    </header>



    <!-- ================= LOGIN ================= -->

    <section class="login-section">

        <div class="login-box">

            <h1>
                Welcome Back 👋
            </h1>

            <p class="login-text">
                Login to your Cairo Bites account
            </p>


            <form id="login-form">


                <!-- Email -->

                <label for="login-email">
                    Email
                </label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="Enter your email"
                    required>



                <!-- Password -->

                <label for="login-password">
                    Password
                </label>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Enter your password"
                    required>



                <!-- Remember Me -->

                <div class="remember">

                    <label>

                        <input
                            type="checkbox"
                            id="remember">

                        Remember me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>



                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>


            </form>


            <!-- Register -->

            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


        </div>

    </section>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Cairo Bites. All Rights Reserved.
        </p>

    </footer>



    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
